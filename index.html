<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HCC">
<meta name="theme-color" content="#F5F3EF">
<link rel="manifest" href="manifest.json">
<title>Household Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3EF;--card:#FFF;--text:#1C1B18;--muted:#7B7970;--faint:#B3B1AA;
  --border:rgba(0,0,0,0.07);--border-med:rgba(0,0,0,0.13);
  --green:#2A7A5A;--green-bg:#E6F4EE;--green-mid:#3FA876;
  --amber:#92600A;--amber-bg:#FEF3E2;
  --red:#8B2828;--red-bg:#FDEAEA;
  --blue:#1A5C9A;--blue-bg:#E8F1FB;
  --purple:#5B3F9A;--purple-bg:#EEEAFA;
  --r:14px;--rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100%;padding-bottom:72px}

/* NAV */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0 8px;cursor:pointer;border:none;background:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500;letter-spacing:0.04em;gap:3px;transition:color 0.15s}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.nav-btn.active{color:var(--green)}

/* HEADER */
.header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 16px 10px;position:sticky;top:0;z-index:50}
.header-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.page-title{font-size:18px;font-weight:500;letter-spacing:-0.3px}
.date-chip{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:0.04em}
.tab-row{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px;margin-bottom:5px}
.tab-row:last-child{margin-bottom:0}
.tab-row::-webkit-scrollbar{display:none}
.tab-divider{height:1px;background:var(--border);margin:5px 0}
.tab{flex-shrink:0;font-size:12px;font-weight:500;padding:5px 11px;border-radius:20px;border:1px solid var(--border-med);background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all 0.15s;font-family:'DM Sans',sans-serif}
.tab.active{background:var(--text);color:#fff;border-color:var(--text)}
.tab.kid{border-color:rgba(26,92,154,0.3);color:var(--blue)}
.tab.kid.active{background:var(--blue);border-color:var(--blue);color:#fff}
.tab.plan{border-color:rgba(91,63,154,0.3);color:var(--purple)}
.tab.plan.active{background:var(--purple);border-color:var(--purple);color:#fff}
.tab.shop{border-color:rgba(42,122,90,0.3);color:var(--green)}
.tab.shop.active{background:var(--green);border-color:var(--green);color:#fff}
.tab.warn{border-color:rgba(146,96,10,0.3);color:var(--amber)}
.tab.warn.active{background:var(--amber);border-color:var(--amber);color:#fff}

/* PAGES */
.page{display:none;padding:12px 12px 0}
.page.active{display:block}

/* SECTION */
.section{margin-bottom:14px}
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px;margin-bottom:6px}
.sec-name{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);flex:1}
.sec-actions{display:flex;align-items:center;gap:6px}
.sec-edit-btn{font-size:11px;font-weight:500;color:var(--muted);background:none;border:1px solid var(--border-med);border-radius:10px;padding:2px 8px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s}
.sec-edit-btn.on{color:var(--amber);border-color:rgba(146,96,10,0.3);background:var(--amber-bg)}
.sec-add-btn{font-size:18px;line-height:1;color:var(--faint);background:none;border:none;cursor:pointer;padding:0 2px;font-weight:300}
.task-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}

/* TASK ROWS */
.task-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);user-select:none;position:relative}
.task-item:last-child{border-bottom:none}
.task-item.tappable{cursor:pointer}
.task-item.tappable:active{background:#F0F9F4}
.task-item.tapped{background:#E6F4EE}
.stale-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.stale-dot.fresh{background:var(--green-mid)}
.stale-dot.ok{background:var(--faint)}
.stale-dot.amber{background:#E8A020}
.stale-dot.red{background:#C94040}
.stale-dot.none{background:var(--border-med)}
.task-left{display:flex;flex-direction:column;flex:1;min-width:0}
.task-label{font-size:15px;color:var(--text);line-height:1.3}
.task-ts{font-family:'DM Mono',monospace;font-size:10px;margin-top:3px}
.ts-fresh{color:var(--green)}.ts-ok{color:var(--muted)}.ts-amber{color:var(--amber)}.ts-red{color:var(--red)}.ts-never{color:var(--faint);font-style:italic}
.task-edit-controls{display:flex;align-items:center;gap:6px;flex-shrink:0}
.task-rename-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--border-med);background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer}
.task-rename-btn svg{width:13px;height:13px;stroke:var(--muted);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.task-delete-btn{width:30px;height:30px;border-radius:50%;border:1px solid rgba(139,40,40,0.2);background:var(--red-bg);display:flex;align-items:center;justify-content:center;cursor:pointer}
.task-delete-btn svg{width:13px;height:13px;stroke:var(--red);stroke-width:2;fill:none;stroke-linecap:round}

/* SUPPLIES two-state */
.supply-actions{display:flex;gap:6px;flex-shrink:0}
.sup-good{font-size:11px;font-weight:500;padding:5px 9px;border-radius:8px;border:1px solid rgba(42,122,90,0.3);background:var(--green-bg);color:var(--green);cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap}
.sup-need{font-size:11px;font-weight:500;padding:5px 9px;border-radius:8px;border:1px solid rgba(139,40,40,0.2);background:var(--red-bg);color:var(--red);cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap}
.sup-good:active{opacity:0.8}.sup-need:active{opacity:0.8}

/* INLINE ADD/RENAME */
.add-row{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px dashed var(--border-med);background:#FAFAF8}
.rename-row{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--border);background:#FAFAF8}
.rename-row:last-child{border-bottom:none}
.add-input,.rename-input{flex:1;border:1px solid var(--border-med);border-radius:var(--rs);padding:8px 10px;font-size:15px;font-family:'DM Sans',sans-serif;color:var(--text);background:var(--card);outline:none}
.add-input:focus,.rename-input:focus{border-color:var(--green)}
.add-save,.rename-save{font-size:13px;font-weight:500;color:var(--green);background:none;border:none;cursor:pointer;padding:4px 8px;font-family:'DM Sans',sans-serif;white-space:nowrap}
.add-cancel,.rename-cancel{font-size:13px;color:var(--muted);background:none;border:none;cursor:pointer;padding:4px 8px;font-family:'DM Sans',sans-serif}

/* KID */
.kid-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--border);user-select:none;cursor:pointer}
.kid-item:last-child{border-bottom:none}
.kid-item:active{background:#F0F6FD}
.kid-check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border-med);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.18s}
.kid-item.completing .kid-check{background:var(--blue);border-color:var(--blue)}
.kid-check svg{width:11px;height:11px;stroke:#fff;stroke-width:2.5;fill:none;opacity:0;transform:scale(0.4);transition:all 0.15s}
.kid-item.completing .kid-check svg{opacity:1;transform:scale(1)}
.kid-label{font-size:15px;color:var(--text);flex:1;line-height:1.3}
.kid-item.completing .kid-label{color:var(--faint)}
.kid-empty{text-align:center;padding:36px 20px;color:var(--muted)}

/* SHOPPING LIST */
.shop-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
.shop-item:last-child{border-bottom:none}
.shop-item:active{background:#F0F9F4}
.shop-check{width:22px;height:22px;border-radius:4px;border:1.5px solid var(--border-med);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
.shop-item.checked .shop-check{background:var(--green);border-color:var(--green)}
.shop-check svg{width:11px;height:11px;stroke:#fff;stroke-width:2.5;fill:none;opacity:0;transition:opacity 0.15s}
.shop-item.checked .shop-check svg{opacity:1}
.shop-item.checked .shop-label{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--faint)}
.shop-label{font-size:15px;color:var(--text);flex:1}
.shop-source{font-size:10px;font-family:'DM Mono',monospace;color:var(--faint);flex-shrink:0}
.shop-del{width:24px;height:24px;border-radius:50%;background:none;border:none;cursor:pointer;color:var(--faint);font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.shop-del:active{color:var(--red)}

/* LEFTOVERS */
.leftover-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border)}
.leftover-item:last-child{border-bottom:none}
.leftover-left{flex:1;min-width:0}
.leftover-name{font-size:15px;color:var(--text);line-height:1.3}
.leftover-date{font-family:'DM Mono',monospace;font-size:10px;margin-top:3px}
.leftover-del{font-size:11px;font-weight:500;padding:5px 10px;border-radius:8px;border:1px solid var(--border-med);background:var(--bg);color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;flex-shrink:0}
.leftover-del:active{background:var(--red-bg);color:var(--red);border-color:rgba(139,40,40,0.2)}

/* MEAL PLAN */
.day-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.day-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;background:var(--bg)}
.day-name{font-size:13px;font-weight:500;color:var(--text)}
.day-preview{font-size:12px;color:var(--muted);flex:1;margin:0 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-chevron{color:var(--faint);font-size:16px;transition:transform 0.2s;line-height:1}
.day-card.open .day-chevron{transform:rotate(180deg)}
.day-body{display:none;padding:12px 14px;border-top:1px solid var(--border)}
.day-card.open .day-body{display:block}
.day-field{margin-bottom:10px}
.day-field:last-child{margin-bottom:0}
.day-field label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);display:block;margin-bottom:4px}
.day-field textarea{width:100%;border:1px solid var(--border-med);border-radius:var(--rs);padding:8px 10px;font-size:14px;font-family:'DM Sans',sans-serif;color:var(--text);background:var(--bg);outline:none;resize:none;min-height:60px;line-height:1.4}
.day-field textarea:focus{border-color:var(--green);background:var(--card)}

/* GROCERY LIST */
.grocery-row{display:flex;gap:8px;margin-bottom:8px}
.grocery-input{flex:1;border:1px solid var(--border-med);border-radius:var(--rs);padding:9px 12px;font-size:15px;font-family:'DM Sans',sans-serif;color:var(--text);background:var(--card);outline:none}
.grocery-input:focus{border-color:var(--purple)}
.grocery-add-btn{padding:9px 14px;border-radius:var(--rs);border:none;background:var(--purple);color:#fff;font-size:14px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap}
.grocery-send-btn{width:100%;padding:11px;border-radius:var(--rs);border:none;background:var(--green-bg);color:var(--green);font-size:14px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;border:1px solid rgba(42,122,90,0.2);margin-bottom:10px}
.grocery-send-btn:active{opacity:0.8}
.grocery-item{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border)}
.grocery-item:last-child{border-bottom:none}
.grocery-label{font-size:15px;color:var(--text);flex:1}
.grocery-del{width:24px;height:24px;border-radius:50%;background:none;border:none;cursor:pointer;color:var(--faint);font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center}
.grocery-del:active{color:var(--red)}

/* MAINTENANCE */
.maint-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
.maint-item:last-child{border-bottom:none}
.maint-item:active{background:#F0F9F4}
.maint-item.tapped{background:#E6F4EE}

/* PET CARE internal tabs */
.inner-tab-row{display:flex;gap:5px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.inner-tab-row::-webkit-scrollbar{display:none}
.inner-tab{flex-shrink:0;font-size:12px;font-weight:500;padding:5px 12px;border-radius:20px;border:1px solid var(--border-med);background:transparent;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif}
.inner-tab.active{background:var(--amber);color:#fff;border-color:var(--amber)}

/* PET APPOINTMENTS */
.appt-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:8px}
.appt-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.appt-date{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);flex-shrink:0}
.appt-reason{font-size:15px;font-weight:500;color:var(--text);flex:1}
.appt-outcome{font-size:13px;color:var(--muted);line-height:1.4;margin-top:4px}
.appt-upcoming{border-left:3px solid var(--blue)}
.appt-past{border-left:3px solid var(--faint)}
.appt-del{font-size:11px;color:var(--faint);background:none;border:none;cursor:pointer;padding:2px 6px;font-family:'DM Sans',sans-serif;margin-top:6px;display:block}
.appt-del:active{color:var(--red)}

/* ACTION BUTTONS */
.action-btn{width:100%;padding:12px;border-radius:var(--r);border:1px solid var(--border-med);background:var(--card);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;margin-bottom:10px;text-align:center}
.action-btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.action-btn.danger{background:var(--red-bg);color:var(--red);border-color:rgba(139,40,40,0.2)}
.action-btn.purple{background:var(--purple-bg);color:var(--purple);border-color:rgba(91,63,154,0.2)}
.action-btn:active{opacity:0.8}

/* SETTINGS */
.settings-group{margin-bottom:16px}
.settings-group-title{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);padding:0 4px;margin-bottom:6px}
.settings-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.settings-row:last-child{border-bottom:none}
.settings-row:active{background:#F7F6F2}
.settings-label{font-size:15px;color:var(--text)}
.settings-sub{font-size:12px;color:var(--muted);margin-top:2px}
.settings-action{font-size:13px;color:var(--green);font-weight:500;flex-shrink:0;margin-left:12px}
.danger-action{color:var(--red)}.danger-label{color:var(--red)}

/* SHEET */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.sheet-overlay.hidden{display:none}
.sheet-box{background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px 40px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto}
.sheet-title{font-size:13px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:16px;text-align:center}
.sheet-btn{width:100%;padding:13px;border-radius:12px;border:none;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;margin-bottom:8px}
.sheet-btn.primary{background:var(--green);color:#fff}
.sheet-btn.purple{background:var(--purple);color:#fff}
.sheet-btn.danger{background:var(--red-bg);color:var(--red)}
.sheet-btn.cancel{background:var(--bg);color:var(--muted)}
.sheet-field{margin-bottom:12px}
.sheet-field label{font-size:12px;font-weight:500;color:var(--muted);display:block;margin-bottom:4px}
.sheet-field input,.sheet-field textarea{width:100%;border:1px solid var(--border-med);border-radius:var(--rs);padding:10px 12px;font-size:15px;font-family:'DM Sans',sans-serif;color:var(--text);background:var(--bg);outline:none}
.sheet-field input:focus,.sheet-field textarea:focus{border-color:var(--green);background:var(--card)}
.sheet-field textarea{resize:none;min-height:80px;line-height:1.4}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.modal-overlay.hidden{display:none}
.modal-sheet{background:var(--card);border-radius:20px 20px 0 0;padding:22px 18px 40px;width:100%;max-width:480px}
.modal-title{font-size:17px;font-weight:500;margin-bottom:6px}
.modal-sub{font-size:14px;color:var(--muted);margin-bottom:18px;line-height:1.5}

.hist-list{border:1px solid var(--border);border-radius:var(--rs);margin-bottom:12px;overflow:hidden;max-height:50vh;overflow-y:auto}
.hist-item{padding:11px 14px;border-bottom:1px solid var(--border)}
.hist-item:last-child{border-bottom:none}
.hist-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.hist-name{font-size:14px;color:var(--text);flex:1}
.hist-date{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);flex-shrink:0}
.hist-meta{font-size:11px;color:var(--faint);margin-top:2px}
.restore-btn{font-size:12px;color:var(--blue);background:none;border:none;cursor:pointer;padding:2px 0;font-family:'DM Sans',sans-serif;margin-top:3px;display:block}
.version-note{text-align:center;font-size:11px;color:var(--faint);font-family:'DM Mono',monospace;margin:16px 0 8px}
.empty-state{text-align:center;padding:36px 20px;color:var(--muted);font-size:14px}
</style>
</head>
<body>

<nav class="nav">
  <button class="nav-btn active" id="navChores" onclick="showPage('chores')">
    <svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    CHORES
  </button>
  <button class="nav-btn" id="navPlanning" onclick="showPage('planning')">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    PLANNING
  </button>
  <button class="nav-btn" id="navSettings" onclick="showPage('settings')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    SETTINGS
  </button>
</nav>

<!-- CHORES HEADER -->

    {sec:'Pets',tasks:['Clean rat cage tray or spot-clean','Refresh rat water and food','Scoop cat litter box','Wipe up fur or tracked litter']}

    {sec:'Kitchen',tasks:['Mop floor','Wipe appliance exteriors','Clean microwave interior','Wipe cabinet fronts','Empty and reline trash']},

  {sec:'Cleaning supplies',tasks:['Dish soap','Dishwasher pods','Hand soap (refills)','All-purpose spray','Bathroom cleaner','Toilet bowl cleaner','Glass / mirror cleaner','Floor cleaner / mop solution','Bleach','Scrubbing powder (Comet, etc.)','Magic Erasers','Paper towels','Trash bags — kitchen','Trash bags — bathroom / small','Rubber gloves']},
  {sec:'Laundry',tasks:['Laundry detergent','Dryer sheets or wool balls','Stain remover spray','Fabric softener']},
  {sec:'Tools and consumables',tasks:['Sponges','Scrub brushes','Microfiber cloths','Mop head (check / replace)','Vacuum bags or filters','Toilet brush (check / replace)']},
  {sec:'Medical and first aid',tasks:['Bandages (assorted)','Gauze pads','Medical tape','Antiseptic wipes or spray','Antibiotic ointment','Hydrogen peroxide','Rubbing alcohol','Thermometer batteries','Pain reliever — adult',"Pain reliever — children's",'Allergy medication — adult',"Allergy medication — children's",'Cold / flu medicine','Antacids','Anti-diarrheal','Hydrocortisone cream','Tweezers (check condition)']},
  {sec:'Feminine products',tasks:['Pads — regular','Pads — overnight','Tampons','Panty liners','Midol or similar']},
  {sec:'Personal care',tasks:['Toothpaste','Toothbrushes (check / replace)','Floss','Mouthwash','Shampoo','Conditioner','Body wash / soap','Deodorant — adult','Deodorant — kids / teen','Razors','Shaving cream','Lotion','Sunscreen','Chapstick / lip balm']},
  {sec:'Pet supplies',tasks:['Cat litter','Cat food — dry','Cat food — wet','Cat flea / tick prevention','Cat treats','Cat toys (check stock)','Rat food / lab blocks','Rat bedding','Rat cage cleaning spray','Rat treats']},
  {sec:'Batteries and household',tasks:['AA batteries','AAA batteries','9V batteries (smoke detectors)','Light bulbs (check for burned out)','Smoke detector test','CO detector test','Fire extinguisher check']}

const BASE_MAINT=Object.keys(MAINT_THRESHOLDS);
const BASE_CAT_MAINT=Object.keys(CAT_MAINT_THRESHOLDS);
const BASE_CAT_SUPPLIES=[
  {sec:'Cat supplies',tasks:['Cat food — dry','Cat food — wet','Cat treats','Cat litter','Litter box liners','Cat flea / tick prevention','Cat shampoo','Cat brush / grooming tool','Nail clippers','Cat toys','Scratching post (check condition)','Cat bed (check condition)','Carrier (check condition)','Cat calming spray / diffuser','Dental treats or toothbrush kit']}
];

// ── STATE ──
function uid(){return Math.random().toString(36).slice(2,10)}

function defaultState(){
  const s={
    activeChoreTab:'daily',activePlanTab:'meals',
    choreTasks:{},kidTasks:{evelyn:[],nathan:[],dylan:[]},
    kidHistory:{evelyn:[],nathan:[],dylan:[]},
    supplies:[],maintTasks:[],
    catMaintTasks:[],catSupplies:[],catAppointments:[],
    activePetTab:'supplies',
    mealPlan:{},groceryList:[],
    leftovers:[],shoppingList:[],
    removedTasks:[]
  };
  // chore tabs
  Object.keys(BASE_CHORES).forEach(tab=>{
    s.choreTasks[tab]=BASE_CHORES[tab].map(sec=>({sec:sec.sec,items:sec.tasks.map(l=>({id:uid(),label:l,ts:null,isCustom:false}))}));
  });
  // supplies
  s.supplies=BASE_SUPPLIES.map(sec=>({sec:sec.sec,items:sec.tasks.map(l=>({id:uid(),label:l,ts:null,isCustom:false}))}));
  // maintenance
  s.maintTasks=BASE_MAINT.map(l=>({id:uid(),label:l,ts:null,isCustom:false}));
  // cat maintenance
  s.catMaintTasks=BASE_CAT_MAINT.map(l=>({id:uid(),label:l,ts:null,isCustom:false}));
  // cat supplies
  s.catSupplies=BASE_CAT_SUPPLIES.map(sec=>({sec:sec.sec,items:sec.tasks.map(l=>({id:uid(),label:l,ts:null,isCustom:false}))}));
  // meal plan
  DAYS.forEach(d=>{s.mealPlan[d]={main:'',sides:'',notes:''};});
  return s;
}

function loadState(){
  try{const r=localStorage.getItem(STORAGE_KEY);if(!r)return defaultState();
    const s=JSON.parse(r);
    if(!s.removedTasks)s.removedTasks=[];
    if(!s.shoppingList)s.shoppingList=[];
    if(!s.leftovers)s.leftovers=[];
    if(!s.groceryList)s.groceryList=[];
    if(!s.catAppointments)s.catAppointments=[];
    if(!s.activePetTab)s.activePetTab='supplies';
    if(!s.catSupplies||s.catSupplies.length===0)s.catSupplies=BASE_CAT_SUPPLIES.map(sec=>({sec:sec.sec,items:sec.tasks.map(l=>({id:uid(),label:l,ts:null,isCustom:false}))}));
    if(!s.mealPlan){s.mealPlan={};DAYS.forEach(d=>{s.mealPlan[d]={main:'',sides:'',notes:''};});}
    DAYS.forEach(d=>{if(!s.mealPlan[d])s.mealPlan[d]={main:'',sides:'',notes:''};});
    KID_TABS.forEach(k=>{if(!s.kidHistory[k])s.kidHistory[k]=[];if(!s.kidTasks[k])s.kidTasks[k]=[];});
    return s;
  }catch(e){return defaultState();}
}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}

let state=loadState();
let activePage='chores';
let activeChoreTab=state.activeChoreTab||'daily';
let activePlanTab=state.activePlanTab||'meals';
let activePetTab=state.activePetTab||'supplies';
let editMode=null;
let addMode=null;
let renameMode=null;

// ── STALENESS ──
function staleClass(ts,thresh){
  if(!thresh)return'none';
  if(!ts)return'ok';
  const d=(Date.now()-ts)/86400000;
  if(d<=thresh.fresh)return'fresh';
  if(d<=thresh.amber)return'ok';
  if(d<=thresh.red)return'amber';
  return'red';
}
function tsLabel(ts){if(!ts)return'Never done';return'Last: '+new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function tsCls(ts,thresh){
  if(!ts)return'ts-never';
  const sc=staleClass(ts,thresh);
  return{fresh:'ts-fresh',ok:'ts-ok',amber:'ts-amber',red:'ts-red',none:'ts-ok'}[sc]||'ts-ok';
}
function leftoverStaleness(ts){
  const d=(Date.now()-ts)/86400000;
  if(d<=LEFTOVER_THRESH.fresh)return{dot:'fresh',cls:'ts-fresh'};
  if(d<=LEFTOVER_THRESH.amber)return{dot:'amber',cls:'ts-amber'};
  return{dot:'red',cls:'ts-red'};
}

// ── PAGE SWITCHING ──
function showPage(page){
  activePage=page;editMode=null;addMode=null;renameMode=null;
  ['chores','planning','settings'].forEach(p=>{
    document.getElementById('page'+cap(p)).classList.toggle('active',p===page);
    document.getElementById('nav'+cap(p)).classList.toggle('active',p===page);
    document.getElementById('hd'+cap(p)).style.display=p===page?'':'none';
  });
  if(page==='chores')renderChores();
  if(page==='planning')renderPlanning();
  if(page==='settings')renderSettings();
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}

// ── CHORES ──
function renderChores(){
  const now=new Date();
  document.getElementById('dateLabel').textContent=now.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}).toUpperCase();
  // tab rows
  const r1=document.getElementById('choresRow1'),r2=document.getElementById('choresRow2');
  r1.innerHTML='';r2.innerHTML='';
  CHORE_ROW1.forEach(t=>r1.appendChild(makeTabBtn(t,'',activeChoreTab,tab=>{activeChoreTab=tab;state.activeChoreTab=tab;editMode=null;addMode=null;renameMode=null;save();renderChores();})));
  CHORE_ROW2.forEach(t=>r2.appendChild(makeTabBtn(t,'kid',activeChoreTab,tab=>{activeChoreTab=tab;state.activeChoreTab=tab;editMode=null;addMode=null;renameMode=null;save();renderChores();})));
  const area=document.getElementById('pageChores');
  area.innerHTML='';
  if(KID_TABS.includes(activeChoreTab))renderKidTab(area,activeChoreTab);
  else renderChoreTab(area,activeChoreTab);
}

function makeTabBtn(tab,cls,activeTab,onClick){
  const b=document.createElement('button');
  const labels={daily:'Daily',weekly:'Weekly',biweekly:'Biweekly',monthly:'Monthly',seasonal:'Seasonal',evelyn:'Evelyn',nathan:'Nathan',dylan:'Dylan',meals:'Meals',leftovers:'Leftovers',shopping:'Shopping',supplies:'Supplies',maintenance:'Maintenance',petcare:'Pet Care'};
  b.className='tab'+(cls?' '+cls:'')+(tab===activeTab?' active':'');
  b.textContent=labels[tab]||tab;
  b.onclick=()=>onClick(tab);
  return b;
}

function renderChoreTab(area,tab){
  const sections=state.choreTasks[tab];
  if(!sections)return;
  const thresh=CHORE_THRESHOLDS[tab];
  sections.forEach((sec,si)=>{
    const isEditing=editMode&&editMode.tab===tab&&editMode.secIdx===si;
    const isAdding=addMode&&addMode.tab===tab&&addMode.secIdx===si;
    const wrap=document.createElement('div');wrap.className='section';
    const head=makeSectionHead(sec.sec,isEditing,
      ()=>{editMode=isEditing?null:{tab,secIdx:si};addMode=null;renameMode=null;renderChores();},
      ()=>{addMode={tab,secIdx:si};editMode=null;renameMode=null;renderChores();setTimeout(()=>{const i=document.getElementById('addInp_'+si);if(i)i.focus();},60);}
    );
    wrap.appendChild(head);
    const card=document.createElement('div');card.className='task-card';
    sec.items.forEach((item,ii)=>{
      const isRenaming=renameMode&&renameMode.tab===tab&&renameMode.secIdx===si&&renameMode.itemIdx===ii;
      if(isRenaming)card.appendChild(makeRenameRow(item,()=>{renameMode=null;save();renderChores();},()=>{renameMode=null;renderChores();}));
      else if(isEditing)card.appendChild(makeEditRow(item,
        ()=>{renameMode={tab,secIdx:si,itemIdx:ii};renderChores();setTimeout(()=>{const i=document.getElementById('renInp_'+si+'_'+ii);if(i){i.focus();i.select();}},60);},
        ()=>{state.removedTasks.unshift({id:item.id,label:item.label,tab,sec:sec.sec,lastTs:item.ts,removedAt:Date.now(),isKid:false});sec.items.splice(ii,1);save();renderChores();}
      ));
      else card.appendChild(makeTimestampRow(item,thresh,()=>{item.ts=Date.now();save();renderChores();}));
    });
    if(isAdding)card.appendChild(makeAddRow('addInp_'+si,v=>{sec.items.push({id:uid(),label:v,ts:null,isCustom:true});addMode=null;save();renderChores();},()=>{addMode=null;renderChores();}));
    wrap.appendChild(card);area.appendChild(wrap);
  });
}

// ── KID TAB ──
function renderKidTab(area,tab){
  const tasks=state.kidTasks[tab];
  const isEditing=editMode&&editMode.tab===tab&&editMode.secIdx===-1;
  const isAdding=addMode&&addMode.tab===tab&&addMode.secIdx===-1;
  const labels={evelyn:'Evelyn',nathan:'Nathan',dylan:'Dylan'};
  const wrap=document.createElement('div');wrap.className='section';
  const head=document.createElement('div');head.className='sec-head';
  const name=document.createElement('span');name.className='sec-name';name.textContent=labels[tab]+"'s tasks";
  const acts=document.createElement('div');acts.className='sec-actions';
  if(tasks.length>0){
    const eb=document.createElement('button');eb.className='sec-edit-btn'+(isEditing?' on':'');eb.textContent=isEditing?'Done':'Edit';
    eb.onclick=()=>{editMode=isEditing?null:{tab,secIdx:-1};addMode=null;renameMode=null;renderChores();};
    acts.appendChild(eb);
  }
  const ab=document.createElement('button');ab.className='sec-add-btn';ab.textContent='+';
  ab.onclick=()=>{addMode={tab,secIdx:-1};editMode=null;renameMode=null;renderChores();setTimeout(()=>{const i=document.getElementById('kidAddInp');if(i)i.focus();},60);};
  acts.appendChild(ab);head.appendChild(name);head.appendChild(acts);wrap.appendChild(head);
  if(tasks.length===0&&!isAdding){
    const e=document.createElement('div');e.className='kid-empty';e.innerHTML='<div style="font-size:28px;margin-bottom:8px">✓</div><div>All done! Tap + to add tasks.</div>';
    wrap.appendChild(e);
  } else {
    const card=document.createElement('div');card.className='task-card';
    tasks.forEach((item,idx)=>{
      const isRenaming=renameMode&&renameMode.tab===tab&&renameMode.secIdx===-1&&renameMode.itemIdx===idx;
      if(isRenaming){
        card.appendChild(makeRenameRow(item,()=>{renameMode=null;save();renderChores();},()=>{renameMode=null;renderChores();}));
      } else if(isEditing){
        card.appendChild(makeEditRow(item,
          ()=>{renameMode={tab,secIdx:-1,itemIdx:idx};renderChores();setTimeout(()=>{const i=document.getElementById('renInp__'+idx);if(i){i.focus();i.select();}},60);},
          ()=>{state.removedTasks.unshift({id:item.id,label:item.label,tab,sec:labels[tab],lastTs:null,removedAt:Date.now(),isKid:true});state.kidTasks[tab].splice(idx,1);save();renderChores();}
        ));
      } else {
        const el=document.createElement('div');el.className='kid-item';
        const ck=document.createElement('div');ck.className='kid-check';ck.innerHTML=`<svg viewBox="0 0 11 11"><polyline points="1.5,5.5 4.5,8.5 9.5,2"/></svg>`;
        const lb=document.createElement('span');lb.className='kid-label';lb.textContent=item.label;
        el.appendChild(ck);el.appendChild(lb);
        el.onclick=()=>{el.classList.add('completing');setTimeout(()=>{state.kidHistory[tab].unshift({id:item.id,label:item.label,completedAt:Date.now()});state.kidTasks[tab].splice(idx,1);save();renderChores();},380);};
        card.appendChild(el);
      }
    });
    if(isAdding)card.appendChild(makeAddRow('kidAddInp',v=>{state.kidTasks[tab].push({id:uid(),label:v});addMode=null;save();renderChores();},()=>{addMode=null;renderChores();}));
    wrap.appendChild(card);
  }
  if(tasks.length===0&&isAdding){
    const c2=document.createElement('div');c2.className='task-card';
    c2.appendChild(makeAddRow('kidAddInp',v=>{state.kidTasks[tab].push({id:uid(),label:v});addMode=null;save();renderChores();},()=>{addMode=null;renderChores();}));
    wrap.appendChild(c2);
  }
  area.appendChild(wrap);
  const hist=state.kidHistory[tab]||[];
  if(hist.length>0&&!isEditing){
    const hw=document.createElement('div');hw.className='section';
    const hh=document.createElement('div');hh.className='sec-head';
    const hn=document.createElement('span');hn.className='sec-name';hn.textContent='Recently completed';
    hh.appendChild(hn);hw.appendChild(hh);
    const hc=document.createElement('div');hc.className='task-card';
    hist.slice(0,8).forEach(h=>{
      const r=document.createElement('div');r.style.cssText='display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border)';
      r.innerHTML=`<span style="font-size:14px;color:var(--text);flex:1">${h.label}</span><span style="font-family:'DM Mono',monospace;font-size:10px;color:var(--faint)">${new Date(h.completedAt).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span>`;
      hc.appendChild(r);
    });
    hw.appendChild(hc);area.appendChild(hw);
  }
}

// ── PLANNING ──
function renderPlanning(){
  const now=new Date();
  document.getElementById('dateLabelP').textContent=now.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}).toUpperCase();
  const r1=document.getElementById('planRow1'),r2=document.getElementById('planRow2');
  r1.innerHTML='';r2.innerHTML='';
  PLAN_ROW1.forEach(t=>r1.appendChild(makeTabBtn(t,t==='meals'?'plan':t==='shopping'?'shop':'',activePlanTab,tab=>{activePlanTab=tab;state.activePlanTab=tab;editMode=null;addMode=null;renameMode=null;save();renderPlanning();})));
  PLAN_ROW2.forEach(t=>r2.appendChild(makeTabBtn(t,t==='maintenance'?'warn':t==='petcare'?'warn':'',activePlanTab,tab=>{activePlanTab=tab;state.activePlanTab=tab;editMode=null;addMode=null;renameMode=null;save();renderPlanning();})));
  const area=document.getElementById('pagePlanning');
  area.innerHTML='';
  if(activePlanTab==='meals')renderMeals(area);
  else if(activePlanTab==='leftovers')renderLeftovers(area);
  else if(activePlanTab==='shopping')renderShopping(area);
  else if(activePlanTab==='supplies')renderSupplies(area);
  else if(activePlanTab==='maintenance')renderMaintenance(area);
  else if(activePlanTab==='petcare')renderPetCare(area);
}

// ── MEALS ──
function renderMeals(area){
  const hdr=document.createElement('div');hdr.className='section';
  const sh=document.createElement('div');sh.className='sec-head';
  const sn=document.createElement('span');sn.className='sec-name';sn.textContent='Meal plan';
  const acts=document.createElement('div');acts.className='sec-actions';
  const resetBtn=document.createElement('button');resetBtn.className='sec-edit-btn';resetBtn.textContent='Reset week';
  resetBtn.onclick=()=>showModal('Reset meal plan?','This clears all meals for the week. Grocery list stays.',[
    {label:'Reset',cls:'danger',action:()=>{DAYS.forEach(d=>{state.mealPlan[d]={main:'',sides:'',notes:''};});save();hideModal();renderPlanning();}},
    {label:'Cancel',cls:'cancel',action:hideModal}
  ]);
  acts.appendChild(resetBtn);sh.appendChild(sn);sh.appendChild(acts);hdr.appendChild(sh);area.appendChild(hdr);

  DAYS.forEach(d=>{
    const meal=state.mealPlan[d];
    const card=document.createElement('div');card.className='day-card';
    const preview=meal.main||'No meal set';
    card.innerHTML=`<div class="day-head"><span class="day-name">${d}</span><span class="day-preview">${preview}</span><span class="day-chevron">&#8964;</span></div>`;
    const body=document.createElement('div');body.className='day-body';
    ['main','sides','notes'].forEach(field=>{

function renderLeftovers(area){
  const wrap=document.createElement('div');wrap.className='section';
  const head=document.createElement('div');head.className='sec-head';
  const name=document.createElement('span');name.className='sec-name';name.textContent='Leftovers in fridge';
  const addBtn=document.createElement('button');addBtn.className='sec-add-btn';addBtn.textContent='+';
  addBtn.onclick=()=>openAddLeftover();
  head.appendChild(name);head.appendChild(addBtn);wrap.appendChild(head);

  if(state.leftovers.length===0){
    const em=document.createElement('div');em.className='empty-state';em.textContent='No leftovers tracked. Tap + to add one.';
    wrap.appendChild(em);
  } else {
    const card=document.createElement('div');card.className='task-card';
    // sort by oldest first (most urgent)
    const sorted=[...state.leftovers].sort((a,b)=>a.addedAt-b.addedAt);
    sorted.forEach(item=>{
      const idx=state.leftovers.findIndex(l=>l.id===item.id);
      const st=leftoverStaleness(item.addedAt);
      const daysAgo=Math.floor((Date.now()-item.addedAt)/86400000);
      const dayStr=daysAgo===0?'Today':daysAgo===1?'Yesterday':daysAgo+' days ago';
      const el=document.createElement('div');el.className='leftover-item';
      const dot=document.createElement('div');dot.className='stale-dot '+st.dot;dot.style.flexShrink='0';
      const left=document.createElement('div');left.className='leftover-left';
      const nm=document.createElement('div');nm.className='leftover-name';nm.textContent=item.label;
      const dt=document.createElement('div');dt.className='leftover-date '+st.cls;dt.textContent='Added: '+new Date(item.addedAt).toLocaleDateString('en-US',{month:'short',day:'numeric'})+' ('+dayStr+')';
      if(item.meal){const ml=document.createElement('div');ml.style.cssText='font-size:11px;color:var(--faint);margin-top:1px';ml.textContent='From: '+item.meal;left.appendChild(nm);left.appendChild(dt);left.appendChild(ml);}
      else{left.appendChild(nm);left.appendChild(dt);}
      const del=document.createElement('button');del.className='leftover-del';del.textContent='Used / Tossed';
      del.onclick=()=>{state.leftovers.splice(idx,1);save();renderPlanning();};
      el.appendChild(dot);el.appendChild(left);el.appendChild(del);
      card.appendChild(el);
    });
    wrap.appendChild(card);
  }
  area.appendChild(wrap);
}

function makeSupplyRow(item,secName){
  const el=document.createElement('div');el.className='task-item';
  const dot=document.createElement('div');dot.className='stale-dot '+staleClass(item.ts,null);dot.className='stale-dot none';
  const left=document.createElement('div');left.className='task-left';
  const lbl=document.createElement('div');lbl.className='task-label';lbl.textContent=item.label;
  const ts=document.createElement('div');ts.className='task-ts '+(item.ts?'ts-ok':'ts-never');ts.textContent=item.ts?'Stocked: '+new Date(item.ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'Not checked recently';
  left.appendChild(lbl);left.appendChild(ts);
  const acts=document.createElement('div');acts.className='supply-actions';
  const good=document.createElement('button');good.className='sup-good';good.textContent='✓ Good';
  good.onclick=()=>{item.ts=Date.now();save();renderPlanning();};
  const need=document.createElement('button');need.className='sup-need';need.textContent='Need it';
  need.onclick=()=>{
    const existing=state.shoppingList.find(i=>i.label.toLowerCase()===item.label.toLowerCase()&&i.source==='Supplies');
    if(!existing){state.shoppingList.push({id:uid(),label:item.label,source:'Supplies',checked:false});}

    const orig=need.textContent;need.textContent='Added!';need.style.opacity='0.6';

  };
  acts.appendChild(good);acts.appendChild(need);
  el.appendChild(dot);el.appendChild(left);el.appendChild(acts);
  return el;
}

function makeApptCard(appt,isUpcoming){

  const del=document.createElement('button');del.className='appt-del';del.textContent='Remove';

    const kidNames={evelyn:'Evelyn',nathan:'Nathan',dylan:'Dylan'};
    addSettingsGroup(area,kidNames[kid]+"'s history",[
      {label:hist.length+' completed tasks',sub:hist.length>0?'Last: '+new Date(hist[0].completedAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'None yet',action:'View',onClick:()=>showKidHistory(kid)},
      {label:"Clear history",sub:'Cannot be undone',action:'Clear',danger:true,onClick:()=>showModal("Clear "+kidNames[kid]+"'s history?",'All records deleted.',[{label:'Clear',cls:'danger',action:()=>{state.kidHistory[kid]=[];save();hideModal();renderSettings();}},{label:'Cancel',cls:'cancel',action:hideModal}])}
    ]);
  });
  addSettingsGroup(area,'Danger zone',[
    {label:'Clear all timestamps',sub:'Reset all last-done dates; keep tasks',action:'Clear',danger:true,onClick:()=>showModal('Clear all timestamps?','All last-done dates erased.',[{label:'Clear',cls:'danger',action:()=>{Object.keys(state.choreTasks).forEach(tab=>state.choreTasks[tab].forEach(sec=>sec.items.forEach(i=>i.ts=null)));state.supplies.forEach(sec=>sec.items.forEach(i=>i.ts=null));state.maintTasks.forEach(i=>i.ts=null);state.catMaintTasks.forEach(i=>i.ts=null);state.catSupplies.forEach(sec=>sec.items.forEach(i=>i.ts=null));save();hideModal();}},{label:'Cancel',cls:'cancel',action:hideModal}])},
    {label:'Factory reset',sub:'Delete everything and start fresh',action:'Reset',danger:true,onClick:()=>showModal('Factory reset?','Deletes ALL data.',[{label:'Reset everything',cls:'danger',action:()=>{state=defaultState();save();hideModal();showPage('chores');}},{label:'Cancel',cls:'cancel',action:hideModal}])}
  ]);
  const ver=document.createElement('div');ver.className='version-note';ver.textContent='Household Command Center v1.0';
  area.appendChild(ver);
}

function addSettingsGroup(area,title,rows){
  const g=document.createElement('div');g.className='settings-group';
  const t=document.createElement('div');t.className='settings-group-title';t.textContent=title;g.appendChild(t);
  const card=document.createElement('div');card.className='settings-card';
  rows.forEach(row=>{
    const el=document.createElement('div');el.className='settings-row';
    el.innerHTML=`<div><div class="settings-label${row.danger?' danger-label':''}">${row.label}</div><div class="settings-sub">${row.sub}</div></div><div class="settings-action${row.danger?' danger-action':''}">${row.action}</div>`;
    el.onclick=row.onClick;card.appendChild(el);
  });
  g.appendChild(card);area.appendChild(g);
}

// ── SHARED COMPONENT BUILDERS ──
function makeSectionHead(title,isEditing,onEdit,onAdd){
  const head=document.createElement('div');head.className='sec-head';
  const name=document.createElement('span');name.className='sec-name';name.textContent=title;
  const acts=document.createElement('div');acts.className='sec-actions';
  const eb=document.createElement('button');eb.className='sec-edit-btn'+(isEditing?' on':'');eb.textContent=isEditing?'Done':'Edit';eb.onclick=onEdit;
  const ab=document.createElement('button');ab.className='sec-add-btn';ab.textContent='+';ab.onclick=onAdd;
  acts.appendChild(eb);acts.appendChild(ab);head.appendChild(name);head.appendChild(acts);
  return head;
}

function makeTimestampRow(item,thresh,onClick){
  const el=document.createElement('div');el.className='task-item tappable';
  const sc=staleClass(item.ts,thresh);
  const dot=document.createElement('div');dot.className='stale-dot '+sc;
  const left=document.createElement('div');left.className='task-left';
  const lbl=document.createElement('div');lbl.className='task-label';lbl.textContent=item.label;
  const ts=document.createElement('div');ts.className='task-ts '+tsCls(item.ts,thresh);ts.textContent=tsLabel(item.ts);
  left.appendChild(lbl);left.appendChild(ts);el.appendChild(dot);el.appendChild(left);
  el.onclick=()=>{el.classList.add('tapped');setTimeout(()=>{onClick();},280);};
  return el;
}

function makeEditRow(item,onRename,onDelete){
  const el=document.createElement('div');el.className='task-item';el.style.background='#FAFAF8';
  const left=document.createElement('div');left.className='task-left';
  const lbl=document.createElement('div');lbl.className='task-label';lbl.textContent=item.label;
  const ts=document.createElement('div');ts.className='task-ts ts-ok';ts.textContent=tsLabel(item.ts);
  left.appendChild(lbl);left.appendChild(ts);
  const ctrls=document.createElement('div');ctrls.className='task-edit-controls';
  const rb=document.createElement('button');rb.className='task-rename-btn';rb.title='Rename';
  rb.innerHTML=`<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;
  rb.onclick=e=>{e.stopPropagation();onRename();};
  const db=document.createElement('button');db.className='task-delete-btn';db.title='Remove';
  db.innerHTML=`<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
  db.onclick=e=>{e.stopPropagation();onDelete();};
  ctrls.appendChild(rb);ctrls.appendChild(db);el.appendChild(left);el.appendChild(ctrls);
  return el;
}

function makeRenameRow(item,onSave,onCancel){
  const el=document.createElement('div');el.className='rename-row';
  const inp=document.createElement('input');inp.className='rename-input';inp.value=item.label;inp.maxLength=80;
  const sv=document.createElement('button');sv.className='rename-save';sv.textContent='Save';
  const cn=document.createElement('button');cn.className='rename-cancel';cn.textContent='Cancel';
  sv.onclick=()=>{const v=inp.value.trim();if(v)item.label=v;onSave();};
  cn.onclick=onCancel;
  inp.onkeydown=e=>{if(e.key==='Enter')sv.onclick();if(e.key==='Escape')cn.onclick();};
  el.appendChild(inp);el.appendChild(sv);el.appendChild(cn);
  return el;
}

function makeAddRow(inputId,onSave,onCancel){
  const el=document.createElement('div');el.className='add-row';
  const inp=document.createElement('input');inp.className='add-input';inp.id=inputId;inp.placeholder='New task name...';inp.maxLength=80;
  const sv=document.createElement('button');sv.className='add-save';sv.textContent='Add';
  const cn=document.createElement('button');cn.className='add-cancel';cn.textContent='Cancel';
  sv.onclick=()=>{const v=inp.value.trim();if(!v)return;onSave(v);};
  cn.onclick=onCancel;
  inp.onkeydown=e=>{if(e.key==='Enter')sv.onclick();if(e.key==='Escape')cn.onclick();};
  el.appendChild(inp);el.appendChild(sv);el.appendChild(cn);
  return el;
}

function makeSheetField(label,type,placeholder,id){
  const f=document.createElement('div');f.className='sheet-field';
  f.innerHTML=`<label>${label}</label>`;
  const inp=document.createElement('input');inp.type=type;inp.placeholder=placeholder;inp.id=id;
  f.appendChild(inp);return f;
}

// ── GRAVEYARD / KID HISTORY ──
function showGraveyard(){
  const box=document.getElementById('sheetBox');box.innerHTML=`<div class="sheet-title">Removed tasks</div>`;
  if(state.removedTasks.length===0){box.innerHTML+=`<div class="empty-state">No removed tasks yet.</div>`;}
  else{
    const list=document.createElement('div');list.className='hist-list';
    state.removedTasks.slice(0,60).forEach((t,idx)=>{
      const row=document.createElement('div');row.className='hist-item';
      const rd=new Date(t.removedAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
      const ld=t.lastTs?new Date(t.lastTs).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'never done';
      row.innerHTML=`<div class="hist-top"><span class="hist-name">${t.label}</span><span class="hist-date">${rd}</span></div><div class="hist-meta">${t.tab} &mdash; ${t.sec} &mdash; last done: ${ld}</div>`;
      const rb=document.createElement('button');rb.className='restore-btn';rb.textContent='↩ Restore';
      rb.onclick=()=>{
        if(t.isKid){state.kidTasks[t.tab].push({id:t.id,label:t.label});}
        else{
          const lookup={'maintenance':()=>state.maintTasks,'catMaint':()=>state.catMaintTasks};
          if(lookup[t.tab]){lookup[t.tab]().push({id:t.id,label:t.label,ts:t.lastTs,isCustom:true});}
          else{
            const tabData=state.choreTasks[t.tab]||state.supplies;
            if(Array.isArray(tabData)){const sec=tabData.find(s=>s.sec===t.sec);if(sec)sec.items.push({id:t.id,label:t.label,ts:t.lastTs,isCustom:true});}
          }
        }
        state.removedTasks.splice(idx,1);save();closeSheet();
        if(activePage==='chores')renderChores();else renderPlanning();
      };
      row.appendChild(rb);list.appendChild(row);
    });
    box.appendChild(list);
  }
  const cb=document.createElement('button');cb.className='sheet-btn cancel';cb.textContent='Close';cb.onclick=closeSheet;
  box.appendChild(cb);openSheet();
}

function showKidHistory(kid){
  const box=document.getElementById('sheetBox');
  const hist=state.kidHistory[kid]||[];
  const names={evelyn:'Evelyn',nathan:'Nathan',dylan:'Dylan'};
  box.innerHTML=`<div class="sheet-title">${names[kid]}'s completed tasks</div>`;
  if(hist.length===0){box.innerHTML+=`<div class="empty-state">No completed tasks yet.</div>`;}
  else{
    const list=document.createElement('div');list.className='hist-list';
    hist.forEach(h=>{
      const row=document.createElement('div');row.className='hist-item';
      const d=new Date(h.completedAt).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
      row.innerHTML=`<div class="hist-top"><span class="hist-name">${h.label}</span><span class="hist-date">${d}</span></div>`;
      list.appendChild(row);
    });
    box.appendChild(list);
  }
  const cb=document.createElement('button');cb.className='sheet-btn cancel';cb.textContent='Close';cb.onclick=closeSheet;
  box.appendChild(cb);openSheet();
}

// ── EXPORT / IMPORT ──
function doExport(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='hcc-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  URL.revokeObjectURL(url);
}
function doImport(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const imported=JSON.parse(ev.target.result);
        showModal('Import backup?','This replaces all current data.',[
          {label:'Replace all data',cls:'danger',action:()=>{state=imported;save();hideModal();showPage('chores');}},
          {label:'Cancel',cls:'cancel',action:hideModal}
        ]);
      }catch(err){alert('Could not read file.');}
    };
    reader.readAsText(file);
  };
  inp.click();
}

// ── SHEET / MODAL ──
function openSheet(){
  const o=document.getElementById('sheetOverlay');o.classList.remove('hidden');
  o.onclick=e=>{if(e.target===o)closeSheet();};
}
function closeSheet(){document.getElementById('sheetOverlay').classList.add('hidden');}
function showModal(title,sub,buttons){
  const o=document.getElementById('modalOverlay'),s=document.getElementById('modalSheet');
  o.classList.remove('hidden');
  s.innerHTML=`<div class="modal-title">${title}</div><div class="modal-sub">${sub}</div>`;
  buttons.forEach(b=>{const btn=document.createElement('button');btn.className='sheet-btn '+b.cls;btn.textContent=b.label;btn.onclick=b.action;s.appendChild(btn);});
  o.onclick=e=>{if(e.target===o)hideModal();};
}
function hideModal(){document.getElementById('modalOverlay').classList.add('hidden');}

// ── INIT ──
showPage('chores');
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
